volumes:
  mongo_data:
    name: mongo_data

networks:
  transcendence:
    name: transcendence
    driver: bridge

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["mongod", "--bind_ip_all", "--noauth"]
    volumes:
      - mongo_data:/data/db
    networks:
      - transcendence
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./back
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "5000"
      MONGO_URI: mongodb://mongo:27017/transcendence
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - transcendence
    expose:
      - "5000"

  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
      target: ${TRC_TARGET:-development}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-80}:${FRONT_CONTAINER_PORT:-80}"
    networks:
      - transcendence
