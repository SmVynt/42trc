volumes:
  mongo_data:
    name: mongo_data

networks:
  transcendence:
    name: transcendence
    driver: bridge

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - transcendence
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-example}
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./back
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: "5000"
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/transcendence}
      MONGO_USER: ${MONGO_USER:-${MONGO_INITDB_ROOT_USERNAME:-root}}
      MONGO_PASS: ${MONGO_PASS:-${MONGO_INITDB_ROOT_PASSWORD:-example}}
      JWT_SK: ${JWT_SK}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - transcendence
    expose:
      - "5000"

  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
      target: ${TRC_TARGET:-development}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-80}:${FRONT_CONTAINER_PORT:-80}"
    networks:
      - transcendence
