volumes:
  postgres_data:
    name: postgres_data

networks:
  transcendence:
    name: transcendence
    driver: bridge

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-transcendence}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret_pass}
      POSTGRES_DB: ${DB_NAME:-transcendence_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - transcendence
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./back
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "5000"
      DB_DSN: "host=postgres user=${DB_USER:-transcendence} password=${DB_PASSWORD:-secret_pass} dbname=${DB_NAME:-transcendence_db} port=5432 sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - transcendence
    expose:
      - "5000"

  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
      target: ${TRC_TARGET:-development}
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_42_CLIENT_ID: ${OAUTH_42_CLIENT_ID}
        VITE_42_REDIRECT_URI: ${OAUTH_42_REDIRECT_URI:-http://localhost:5173/login}
        VITE_42_SCOPE: ${OAUTH_42_SCOPE:-public}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: ${VITE_API_URL:-}
      VITE_42_CLIENT_ID: ${OAUTH_42_CLIENT_ID}
      VITE_42_REDIRECT_URI: ${OAUTH_42_REDIRECT_URI:-http://localhost:5173/login}
      VITE_42_SCOPE: ${OAUTH_42_SCOPE:-public}
    ports:
      - "${HTTP_PORT:-80}:${FRONT_CONTAINER_PORT:-80}"
    networks:
      - transcendence