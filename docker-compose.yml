volumes:
  postgres_data:
    name: postgres_data

networks:
  transcendence:
    name: transcendence
    driver: bridge

services:
  seed:
    image: golang:1.26-alpine
    working_dir: /app
    env_file:
      - .env
    volumes:
      - ./back:/app
    networks:
      - transcendence
    profiles:
      - tools
      
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - transcendence
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  
  backend:
    build:
      context: ./back
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - transcendence
    expose:
      - "5000"

  backend-game:
    build:
      context: ./back-game
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "5001"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - transcendence
    ports:
      - "5001:5001"
    expose:
      - "5001"

  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
      target: ${TRC_TARGET:-development}
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_42_CLIENT_ID: ${OAUTH_42_CLIENT_ID}
        VITE_42_REDIRECT_URI: ${OAUTH_42_REDIRECT_URI:-http://localhost:5173/login}
        VITE_42_SCOPE: ${OAUTH_42_SCOPE:-public}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: ${VITE_API_URL:-}
      VITE_42_CLIENT_ID: ${OAUTH_42_CLIENT_ID}
      VITE_42_REDIRECT_URI: ${OAUTH_42_REDIRECT_URI:-http://localhost:5173/login}
      VITE_42_SCOPE: ${OAUTH_42_SCOPE:-public}
      VITE_GAME_SERVER_URL: ${VITE_GAME_SERVER_URL:-http://localhost:5001}
    ports:
      - "5173:${FRONT_CONTAINER_PORT:-5173}"
    networks:
      - transcendence

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - transcendence