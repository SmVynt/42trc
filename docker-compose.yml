volumes:
  mongo_data:
    name: mongo_data
  postgres_data:
    name: postgres_data

networks:
  transcendence:
    name: transcendence
    driver: bridge

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["mongod", "--bind_ip_all", "--noauth"]
    volumes:
      - mongo_data:/data/db
    networks:
      - transcendence
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-42trc_game}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - transcendence
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./back
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "5000"
      MONGO_URI: mongodb://mongo:27017/transcendence
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - transcendence
    expose:
      - "5000"

  backend-game:
    build:
      context: ./back-game
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "5001"
      NODE_ENV: ${NODE_ENV:-development}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-42trc_game}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5174}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - transcendence
    expose:
      - "5001"

  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
      target: ${TRC_TARGET:-development}
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_42_CLIENT_ID: ${OAUTH_42_CLIENT_ID}
        VITE_42_REDIRECT_URI: ${OAUTH_42_REDIRECT_URI:-http://localhost:5173/login}
        VITE_42_SCOPE: ${OAUTH_42_SCOPE:-public}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: ${VITE_API_URL:-}
      VITE_42_CLIENT_ID: ${OAUTH_42_CLIENT_ID}
      VITE_42_REDIRECT_URI: ${OAUTH_42_REDIRECT_URI:-http://localhost:5173/login}
      VITE_42_SCOPE: ${OAUTH_42_SCOPE:-public}
    ports:
      - "${HTTP_PORT:-80}:${FRONT_CONTAINER_PORT:-80}"
    networks:
      - transcendence
