name: CI/CD

on:
  push:
    branches:
      - main
      - ci-cd-tests
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  POSTGRES_USER: ci
  POSTGRES_PASSWORD: ci
  POSTGRES_DB: transcendence
  DATABASE_URL: postgres://ci:ci@localhost:5432/transcendence?sslmode=disable
  OAUTH_42_CLIENT_ID: ci-client
  OAUTH_42_CLIENT_SECRET: ci-secret
  VITE_API_URL: http://localhost
  VITE_GAME_SERVER_URL: /game

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: back/go.mod
          cache-dependency-path: back/go.sum

      - name: Run tests
        run: go test ./...

      - name: Run static analysis
        run: go vet ./...

  game-backend:
    name: Game server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back-game
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: back-game/go.mod
          cache-dependency-path: back-game/go.sum

      - name: Run tests
        run: go test ./...

      - name: Run static analysis
        run: go vet ./...

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

  compose:
    name: Validate Compose configuration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create CI environment file
        run: touch .env

      - name: Validate Docker Compose
        run: docker compose config --quiet

  container-build:
    name: Build production containers
    runs-on: ubuntu-latest
    needs:
      - backend
      - game-backend
      - frontend
      - compose
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create CI environment file
        run: touch .env

      - name: Build Docker images
        run: docker compose build
